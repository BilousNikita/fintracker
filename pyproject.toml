[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fintracker"
version = "0.1.0"
description = "Command-line personal finance tracker (Python + SQLite)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/BilousNikita/fintracker"

[project.scripts]
fintracker = "fintracker.cli:main"

[tool.setuptools]
packages = ["fintracker"]

[tool.setuptools.package-data]
fintracker = ["schema.sql"]
